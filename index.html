 * ApexTracker — ponte Google Drive (Google Apps Script Web App)
 * 1) Execute a função "autorizar" uma vez: aceita as permissões e gera o TOKEN (aparece no log de execução).
 * 2) Implantar > Nova implantação > App da Web · Executar como: Eu · Quem pode acessar: Qualquer pessoa.
 * O token fica nas Propriedades do script — não precisa editar este código.
 */
const DB_FILE = 'ApexTracker_DB.json';
const MD_FILE = 'ApexTracker_Sync.md';
const DOC_NAME = 'ApexTracker_Relatorio'; // Google Doc espelho do .md (leitura mais confiável pelo Gemini)

function token_() { return PropertiesService.getScriptProperties().getProperty('TOKEN'); }

function doPost(e) {
  const body = JSON.parse(e.postData.contents);
  if (!token_() || body.token !== token_()) return out_({ ok: false, error: 'token inválido' });
  const lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    upsert_(DB_FILE, JSON.stringify(body.data, null, 1), 'application/json');
    upsert_(MD_FILE, body.markdown || '', 'text/markdown');
    if (body.markdown) writeDoc_(body.markdown);
    return out_({ ok: true, savedAt: new Date().toISOString(), bytes: e.postData.length });
  } finally { lock.releaseLock(); }
}

function doGet(e) {
  const p = e.parameter || {};
  if (!token_() || p.token !== token_()) return out_({ ok: false, error: 'token inválido' });
  if (p.action === 'ping') return out_({ ok: true, user: Session.getEffectiveUser().getEmail() });
  const f = find_(DB_FILE);
  return out_(f ? { ok: true, data: JSON.parse(f.getBlob().getDataAsString()), modifiedAt: f.getLastUpdated() } : { ok: false, error: 'sem backup no Drive' });
}

function find_(name) {
  const it = DriveApp.getRootFolder().getFilesByName(name);
  while (it.hasNext()) { const f = it.next(); if (!f.isTrashed()) return f; }
  return null;
}

function upsert_(name, content, mime) {
  const f = find_(name);
  if (f) f.setContent(content); else DriveApp.getRootFolder().createFile(name, content, mime);
}

function writeDoc_(md) {
  const props = PropertiesService.getScriptProperties();
  let doc;
  try { doc = DocumentApp.openById(props.getProperty('DOC_ID')); } catch (err) { doc = null; }
  if (!doc) { doc = DocumentApp.create(DOC_NAME); props.setProperty('DOC_ID', doc.getId()); }
  const b = doc.getBody();
  b.setText(md);
  b.getParagraphs().forEach(function (p) {
    const m = p.getText().match(/^(#{1,3})\\s+(.*)$/);
    if (m) { p.setText(m[2]); p.setHeading([0, DocumentApp.ParagraphHeading.HEADING1, DocumentApp.ParagraphHeading.HEADING2, DocumentApp.ParagraphHeading.HEADING3][m[1].length]); }
  });
  doc.saveAndClose();
}

function out_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

/** Rode uma vez: autoriza Drive/Docs e cria o token aleatório (mostrado no log). Rodar de novo só exibe o mesmo token. */
function autorizar() {
  const props = PropertiesService.getScriptProperties();
  if (!props.getProperty('TOKEN')) props.setProperty('TOKEN', Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().slice(0, 8));
  find_(DB_FILE);
  Logger.log('TOKEN=' + props.getProperty('TOKEN'));
}

/** Use só se o token vazar: gera outro (depois atualize o app). */
function trocarToken() { PropertiesService.getScriptProperties().deleteProperty('TOKEN'); autorizar(); }
